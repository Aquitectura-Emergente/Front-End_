<div class="shell" [class.is-nav-open]="layout.sidebarOpen()" [class.is-rail-collapsed]="layout.railCollapsed()">
  <aside class="shell__nav">
    <app-sidebar />
  </aside>

  <div class="shell__scrim" (click)="layout.close()" aria-hidden="true"></div>

  <div class="shell__main">
    <header class="shell__top">
      <app-topbar />
    </header>

    <main class="shell__content" id="main">
      <router-outlet />
    </main>
  </div>
</div>
<app-toast></app-toast>
